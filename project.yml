name: CiJian
options:
  bundleIdPrefix: com.biditech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7DHNZZZT49"

targets:
  CiJian:
    type: application
    platform: iOS
    sources:
      - CiJian
    settings:
      base:
        # 显式声明：XcodeGen 默认会用 bundleIdPrefix + target 名拼成 com.biditech.CiJian，
        # 而 Apple portal 上注册的是全小写，两者在 Apple 侧是不同的 identifier。
        PRODUCT_BUNDLE_IDENTIFIER: com.biditech.cijian
        # 下面所有 INFOPLIST_KEY_* 只有在开启自动生成时才会被写进 Info.plist；
        # 不开的话 target 根本没有 Info.plist，签名阶段会直接失败。
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "瓷鉴需要使用相机拍摄瓷器照片进行 AI 鉴定"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "瓷鉴需要访问相册以选择瓷器照片进行 AI 鉴定"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
