workflows:
  ios-build:
    name: CiJian iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      xcode: 15.4
      cocoapods: default
      vars:
        XCODE_SCHEME: "CiJian"
        BUNDLE_ID: "com.biditech.CiJian"

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build iOS app
        script: |
          xcodebuild build \
            -project CiJian.xcodeproj \
            -scheme CiJian \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

    publishing:
      email:
        recipients:
          - dauphinking@gmail.com
        notify:
          success: true
          failure: true
