definitions:
  env_versions: &env_versions
    xcode: 26.0
    vars:
      XCODE_PROJECT: "CiJian.xcodeproj"
      XCODE_SCHEME: "CiJian"
      # 大小写必须与 Apple Developer portal 上注册的 identifier 完全一致
      BUNDLE_ID: "com.biditech.cijian"
      TEAM_ID: "7DHNZZZT49"

  scripts:
    - &install_xcodegen
      name: Install XcodeGen
      script: |
        which xcodegen || brew install xcodegen
        xcodegen --version

    - &generate_project
      name: Generate Xcode project
      script: xcodegen generate --spec project.yml

workflows:
  ios-build:
    name: CiJian iOS Build (Simulator)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment: *env_versions

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: "claude/*"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - *install_xcodegen
      - *generate_project

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - dauphinking@gmail.com
        notify:
          success: false
          failure: true

  # 复用 Eyecoming 已有的 App Store Connect integration（bihuijin）+ Team 7DHNZZZT49。
  # 这里不用 environment.ios_signing 自动签名：它在环境准备阶段就要求 profile 已存在，
  # 缺 profile 会直接失败。改由下面的 fetch-signing-files --create 按需创建。
  ios-testflight:
    name: CiJian TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: bihuijin

    environment:
      <<: *env_versions

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - *install_xcodegen
      - *generate_project

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all $BUILD_NUMBER

      - name: Fetch signing files
        script: |
          # use-profiles 是按 bundle id 把 profile 匹配到 target 的：项目里的
          # PRODUCT_BUNDLE_IDENTIFIER 与 profile 的 bundle id 有任何差异（含大小写）
          # 都会静默匹配不上，最终在 archive 阶段才报 "requires a provisioning profile"。
          # 这里提前比对，把它变成一个位置明确的早期失败。
          PROJECT_BUNDLE_ID=$(
            xcodebuild -project "$XCODE_PROJECT" \
                       -scheme "$XCODE_SCHEME" \
                       -configuration Release \
                       -showBuildSettings 2>/dev/null \
            | awk -F' = ' '/ PRODUCT_BUNDLE_IDENTIFIER = /{print $2; exit}'
          )
          echo "project  bundle id: '$PROJECT_BUNDLE_ID'"
          echo "signing  bundle id: '$BUNDLE_ID'"
          if [ "$PROJECT_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "ERROR: bundle id 不一致 —— project.yml 的 PRODUCT_BUNDLE_IDENTIFIER"
            echo "       必须与 codemagic.yaml 的 BUNDLE_ID 完全相同（大小写敏感）。"
            exit 1
          fi

          # --create：identifier 或 profile 不存在时自动创建
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain initialize
          keychain add-certificates

          xcode-project use-profiles --project "$XCODE_PROJECT"

          # 确认 profile 真的写进了 target，而不是等到 archive 才发现没写进去
          xcodebuild -project "$XCODE_PROJECT" \
                     -scheme "$XCODE_SCHEME" \
                     -configuration Release \
                     -showBuildSettings 2>/dev/null \
          | grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM" || true

      - name: Build ipa
        script: |
          # use-profiles 已经跑过，但它是否真的把 PROVISIONING_PROFILE_SPECIFIER
          # 写进了 pbxproj 无法保证（写不进去时它不报错，archive 阶段才炸）。
          # 这里从实际下载到的 profile 里取 UUID，直接作为 build setting 传给 archive，
          # 不依赖项目文件被改写。UUID 不含空格，可安全放进 --archive-flags。
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE=""
          for p in "$PROFILE_DIR"/*.mobileprovision; do
            [ -e "$p" ] || continue
            APP_ID=$(security cms -D -i "$p" 2>/dev/null \
                     | plutil -extract Entitlements.application-identifier raw - 2>/dev/null)
            echo "found profile: $(basename "$p") → $APP_ID"
            case "$APP_ID" in
              *".$BUNDLE_ID") PROFILE="$p" ;;
            esac
          done

          if [ -z "$PROFILE" ]; then
            echo "ERROR: 没有找到 $BUNDLE_ID 对应的 provisioning profile。"
            echo "       上一步 fetch-signing-files 可能没有真正下载/创建成功。"
            exit 1
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          echo "using profile: $(basename "$PROFILE")  UUID=$PROFILE_UUID"

          ARCHIVE_FLAGS="CODE_SIGN_STYLE=Manual"
          ARCHIVE_FLAGS="$ARCHIVE_FLAGS DEVELOPMENT_TEAM=$TEAM_ID"
          ARCHIVE_FLAGS="$ARCHIVE_FLAGS PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"
          ARCHIVE_FLAGS="$ARCHIVE_FLAGS CODE_SIGN_IDENTITY=\"Apple Distribution\""
          echo "archive flags: $ARCHIVE_FLAGS"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags "$ARCHIVE_FLAGS"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - dauphinking@gmail.com
        notify:
          success: true
          failure: true
