definitions:
  env_versions: &env_versions
    xcode: 26.0
    vars:
      XCODE_PROJECT: "CiJian.xcodeproj"
      XCODE_SCHEME: "CiJian"
      # 大小写必须与 Apple Developer portal 上注册的 identifier 完全一致
      BUNDLE_ID: "com.biditech.cijian"

  scripts:
    - &install_xcodegen
      name: Install XcodeGen
      script: |
        which xcodegen || brew install xcodegen
        xcodegen --version

    - &generate_project
      name: Generate Xcode project
      script: xcodegen generate --spec project.yml

workflows:
  ios-build:
    name: CiJian iOS Build (Simulator)
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment: *env_versions

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: "claude/*"
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - *install_xcodegen
      - *generate_project

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - dauphinking@gmail.com
        notify:
          success: false
          failure: true

  # 复用 Eyecoming 已有的 App Store Connect integration（bihuijin）+ Team 7DHNZZZT49。
  # 这里不用 environment.ios_signing 自动签名：它在环境准备阶段就要求 profile 已存在，
  # 缺 profile 会直接失败。改由下面的 fetch-signing-files --create 按需创建。
  ios-testflight:
    name: CiJian TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: bihuijin

    environment:
      <<: *env_versions

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - *install_xcodegen
      - *generate_project

      - name: Set build number
        script: |
          cd $CM_BUILD_DIR
          agvtool new-version -all $BUILD_NUMBER

      - name: Fetch signing files
        script: |
          # --create：identifier 或 profile 不存在时自动创建
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - dauphinking@gmail.com
        notify:
          success: true
          failure: true
